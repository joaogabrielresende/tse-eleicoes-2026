name: Baixar dados oficiais TSE 2026

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baixar-tse.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TSE_CDN: https://cdn.tse.jus.br/estatistica/sead

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Preparar ambiente
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
          mkdir -p saida/{cadastro,propostas,fotos,logs}

      - name: Baixar cadastro oficial de candidaturas
        run: |
          set -euxo pipefail
          url="$TSE_CDN/odsele/consulta_cand/consulta_cand_2026.zip"
          echo "$url" | tee saida/logs/url_cadastro.txt
          curl -fL --retry 5 --retry-all-errors --connect-timeout 30 "$url" -o /tmp/candidatos.zip
          unzip -q /tmp/candidatos.zip -d saida/cadastro
          find saida/cadastro -type f -printf '%p\n' | sort > saida/logs/arquivos_cadastro.txt

      - name: Montar manifesto de Presidente e Governadores
        run: |
          python3 - <<'PY'
          import csv, glob, json, unicodedata

          files = sorted(glob.glob('saida/cadastro/**/*.csv', recursive=True))
          if not files:
              raise SystemExit('Nenhum CSV de candidaturas foi encontrado')

          def norm(s):
              s = unicodedata.normalize('NFKD', s or '').encode('ascii','ignore').decode().upper()
              return s.strip()

          selected = {}
          for src in files:
              with open(src, 'r', encoding='latin1', errors='replace', newline='') as f:
                  r = csv.DictReader(f, delimiter=';')
                  for row in r:
                      cargo = norm(row.get('DS_CARGO'))
                      if cargo not in {'PRESIDENTE', 'GOVERNADOR'}:
                          continue
                      sq = (row.get('SQ_CANDIDATO') or '').strip()
                      if sq:
                          selected[sq] = row

          rows = list(selected.values())
          if not rows:
              raise SystemExit('Nenhuma candidatura a Presidente/Governador encontrada')

          rows.sort(key=lambda r: (0 if norm(r.get('DS_CARGO')) == 'PRESIDENTE' else 1, r.get('SG_UF',''), r.get('NM_URNA_CANDIDATO','')))
          fields = ['SQ_CANDIDATO','SG_UF','DS_CARGO','NM_CANDIDATO','NM_URNA_CANDIDATO','NR_CANDIDATO','SG_PARTIDO','NM_PARTIDO','NM_COLIGACAO','DS_COMPOSICAO_COLIGACAO','DS_SITUACAO_CANDIDATURA']

          with open('saida/manifesto.csv','w',encoding='utf-8',newline='') as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader()
              for row in rows:
                  w.writerow({k: row.get(k,'') for k in fields})

          with open('saida/manifesto.json','w',encoding='utf-8') as f:
              json.dump([{k: row.get(k,'') for k in fields} for row in rows], f, ensure_ascii=False, indent=2)

          print('CSVs lidos:', len(files))
          print('Candidaturas selecionadas:', len(rows))
          print('Presidentes:', sum(1 for r in rows if norm(r.get('DS_CARGO')) == 'PRESIDENTE'))
          print('Governadores:', sum(1 for r in rows if norm(r.get('DS_CARGO')) == 'GOVERNADOR'))
          PY

      - name: Baixar e extrair propostas oficiais de governo
        run: |
          set -euxo pipefail
          ufs=(BR AC AL AM AP BA CE DF ES GO MA MG MS MT PA PB PE PI PR RJ RN RO RR RS SC SE SP TO)
          : > saida/logs/propostas_download.txt
          for uf in "${ufs[@]}"; do
            url="$TSE_CDN/odsele/proposta_governo/proposta_governo_2026_${uf}.zip"
            echo "$uf $url" | tee -a saida/logs/propostas_download.txt
            mkdir -p "saida/propostas/$uf"
            if curl -fL --retry 5 --retry-all-errors --connect-timeout 30 "$url" -o "/tmp/proposta_${uf}.zip"; then
              unzip -q -o "/tmp/proposta_${uf}.zip" -d "saida/propostas/$uf"
              rm -f "/tmp/proposta_${uf}.zip"
            else
              echo "FALHA $uf $url" | tee -a saida/logs/propostas_download.txt
            fi
          done
          find saida/propostas -type f -printf '%p\n' | sort > saida/logs/arquivos_propostas.txt

      - name: Baixar pacotes de fotos e preservar apenas Presidente e Governadores
        run: |
          set -euxo pipefail
          ufs=(BR AC AL AM AP BA CE DF ES GO MA MG MS MT PA PB PE PI PR RJ RN RO RR RS SC SE SP TO)
          : > saida/logs/fotos_download.txt
          for uf in "${ufs[@]}"; do
            url="$TSE_CDN/eleicoes/eleicoes2026/fotos/foto_cand2026_${uf}_div.zip"
            echo "$uf $url" | tee -a saida/logs/fotos_download.txt
            rm -rf /tmp/fotos_uf && mkdir -p /tmp/fotos_uf "saida/fotos/$uf"
            if curl -fL --retry 5 --retry-all-errors --connect-timeout 30 "$url" -o "/tmp/fotos_${uf}.zip"; then
              unzip -q -o "/tmp/fotos_${uf}.zip" -d /tmp/fotos_uf
              UF="$uf" python3 - <<'PY'
          import csv, os, glob, shutil
          uf = os.environ['UF']
          wanted = []
          with open('saida/manifesto.csv', encoding='utf-8', newline='') as f:
              for r in csv.DictReader(f):
                  cargo = r['DS_CARGO'].upper()
                  if (uf == 'BR' and cargo == 'PRESIDENTE') or (uf != 'BR' and r['SG_UF'] == uf and cargo == 'GOVERNADOR'):
                      wanted.append(r['SQ_CANDIDATO'])

          all_files = [p for p in glob.glob('/tmp/fotos_uf/**/*', recursive=True) if os.path.isfile(p)]
          copied = 0
          for sq in wanted:
              matches = [p for p in all_files if os.path.splitext(os.path.basename(p))[0] == sq]
              if not matches:
                  matches = [p for p in all_files if sq in os.path.basename(p)]
              if matches:
                  src = matches[0]
                  ext = os.path.splitext(src)[1].lower() or '.jpg'
                  dst = f'saida/fotos/{uf}/{sq}{ext}'
                  shutil.copy2(src, dst)
                  copied += 1
              else:
                  print('FOTO NAO LOCALIZADA', uf, sq)
          print(uf, 'selecionados', len(wanted), 'copiados', copied)
          PY
              rm -rf /tmp/fotos_uf "/tmp/fotos_${uf}.zip"
            else
              echo "FALHA $uf $url" | tee -a saida/logs/fotos_download.txt
            fi
          done
          find saida/fotos -type f -printf '%p\n' | sort > saida/logs/arquivos_fotos.txt

      - name: Gerar auditoria final
        run: |
          python3 - <<'PY'
          import csv, glob, os, json
          with open('saida/manifesto.csv', encoding='utf-8') as f:
              cand = list(csv.DictReader(f))
          fotos = glob.glob('saida/fotos/**/*', recursive=True)
          fotos = {os.path.splitext(os.path.basename(p))[0]: p for p in fotos if os.path.isfile(p)}
          pdfs = glob.glob('saida/propostas/**/*.pdf', recursive=True)
          report = {
              'candidaturas': len(cand),
              'presidentes': sum(1 for r in cand if r['DS_CARGO'].upper() == 'PRESIDENTE'),
              'governadores': sum(1 for r in cand if r['DS_CARGO'].upper() == 'GOVERNADOR'),
              'fotos_oficiais_localizadas': sum(1 for r in cand if r['SQ_CANDIDATO'] in fotos),
              'pdfs_propostas_extraidos': len(pdfs),
              'sem_foto': [r for r in cand if r['SQ_CANDIDATO'] not in fotos]
          }
          with open('saida/auditoria.json','w',encoding='utf-8') as f:
              json.dump(report, f, ensure_ascii=False, indent=2)
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Publicar dados oficiais extraidos
        uses: actions/upload-artifact@v4
        with:
          name: tse-2026-presidente-governadores
          path: saida/
          if-no-files-found: error
          retention-days: 7
